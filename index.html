<style>

.pn input,.pn select,.pn textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--ln);border-radius:12px;background:#fff;color:var(--ink);margin:4px 0 10px}

.it button{min-height:56px;padding:8px 14px}small{color:#456}

</style></head><body>

<input id="bi" type="file" accept=".zip" hidden></div>
<div id="pr"></div>

<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(3,'0'),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const S=(k,d='')=>localStorage.getItem(k)??d,W=(k,v)=>localStorage.setItem(k,v);
const SL={new:'جديد',old:'قديم',bad:'تالف',unk:'غير معروفة','':'غير محدد'},QL={wait:'بانتظار التحويل',busy:'جاري',done:'تم',fail:'مشكلة'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ex=t=>/mp4/.test(t)?'m4a':/wav/.test(t)?'wav':'webm';
const nz=s=>s.replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
const KW={sec:'كهرباء: كهرب, سلك, اسلاك, مفتاح, بريزة, قاطع, لمبة, كيبل, فيش\nماء: ماء, مياه, حنفية, سيفون, كوع, انبوب, بايب, خلاط\nتنظيف: تنظيف, منظف, مكنسة, ممسحة, صابون, كلور\nبرمجة: برمجة, كمبيوتر, لابتوب, راوتر, شبكة, هارد, ماوس, كيبورد, طابعة',bad:'تالف, مكسور, خربان, معطوب, خراب',old:'قديم, مستعمل, عتيق',nw:'جديد, جديدة',unk:'ما اعرفها, ما اعرفه, ما اعرف, مجهول, ما ادري'};
let vl=[],vc,db,N=0,stream,rc=null,redo=null,busy=false,tt,ft,urls=[],shown=50,ec,aud;
// ---------- قاعدة البيانات ----------
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('jard',1);q.onupgradeneeded=()=>q.result.createObjectStore('items',{keyPath:'code'});q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j(q.error)});
const tx=(m,f)=>new Promise((r,j)=>{const t=db.transaction('items',m);const v=f(t.objectStore('items'));t.oncomplete=()=>r(v&&'result'in v?v.result:v);t.onerror=t.onabort=()=>j(t.error)});
const put=i=>tx('readwrite',s=>s.put(i)),get=c=>tx('readonly',s=>s.get(c)),all=()=>tx('readonly',s=>s.getAll()),del=c=>tx('readwrite',s=>s.delete(c));
// ---------- واجهة ----------
function toast(m,ok){const t=$('#toast');t.textContent=m;t.className=ok?'on ok':'on';ok||navigator.vibrate?.([200,100,200]);clearTimeout(tt);tt=setTimeout(()=>t.className='',3000)}
function flash(c){const f=$('#fl');f.textContent=c;f.className='on';navigator.vibrate?.(120);clearTimeout(ft);ft=setTimeout(()=>f.className='',2000)}
function go(id){document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.id==id));if(id=='pl')list();if(id=='ps')fillSet()}
async function stat(){const a=await all(),w=a.filter(i=>i.q=='wait'||i.q=='busy').length,f=a.filter(i=>i.q=='fail').length;
$('#q').textContent=(w?'⏳ '+w+' ':'')+(f?'⚠ '+f+' ':'')+(w&&!S('key')?'(لا يوجد مفتاح)':'');$('#bg').textContent=a.length||''}
const ui=on=>{$('#rec').className=on?'on':'';$('#hint').style.display=on?'none':''};
// ---------- الكاميرا ----------
async function cam(){try{stream?.getTracks().forEach(t=>{t.onended=null;t.stop()});
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:{echoCancellation:true,noiseSuppression:true}});
$('video').srcObject=stream;stream.getTracks().forEach(t=>t.onended=()=>document.visibilityState=='visible'&&setTimeout(cam,800))}
catch(e){stream=null;toast('الكاميرا أو المايك: '+e.name)}
try{await navigator.wakeLock.request('screen')}catch{}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'){(!stream||stream.getTracks().some(t=>t.readyState!='live'))?cam():navigator.wakeLock?.request('screen').catch(()=>{});kick()}});
function photo(){const v=$('video'),k=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight)),c=document.createElement('canvas');c.width=v.videoWidth*k;c.height=v.videoHeight*k;c.getContext('2d').drawImage(v,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.7))}
$('#cam').onclick=()=>{if(rc)return rc.stop();if(!stream)return cam();redo?rec(null,redo):rec(photo(),null)};
$('#bar').onclick=e=>e.stopPropagation();$('#bl').onclick=()=>go('pl');$('#bs').onclick=()=>go('ps');
$('#rd').onclick=e=>{e.stopPropagation();redo=null;$('#rd').className=''};
// ---------- التسجيل ----------
function rec(imgP,code){try{
const ms=new MediaStream(stream.getAudioTracks()),mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'',
mr=new MediaRecorder(ms,mt?{mimeType:mt}:{}),ch=[],ac=new(window.AudioContext||webkitAudioContext)(),an=ac.createAnalyser(),buf=new Float32Array(1024),t0=Date.now(),cal=[];
an.fftSize=1024;ac.resume();ac.createMediaStreamSource(ms).connect(an);let fl=null,last=t0,done=0;
const stop=()=>{if(done)return;done=1;clearInterval(iv);rc=null;ui(0);mr.state!='inactive'&&mr.stop()},
iv=setInterval(()=>{an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const l=Math.sqrt(s/buf.length),el=Date.now()-t0;
$('#lv').style.width=Math.min(100,l*700)+'%';$('#tm').textContent=Math.floor(el/60000)+':'+String(Math.floor(el/1000)%60).padStart(2,'0');
if(el<800){cal.push(l);return}if(fl===null)fl=Math.min(.03,Math.min(...cal));
if(l>Math.max(.02,fl*2.5))last=Date.now();if(Date.now()-last>7000||el>120000)stop()},100);
mr.ondataavailable=e=>e.data.size&&ch.push(e.data);mr.onerror=()=>{toast('فشل التسجيل');stop()};
mr.onstop=()=>{ac.close();fin(imgP,code,new Blob(ch,{type:mr.mimeType||mt||'audio/webm'}))};
mr.start(1000);rc={stop};ui(1)}catch(e){toast('فشل بدء التسجيل')}}
async function fin(imgP,code,b){try{
if(code){const i=await get(code);Object.assign(i,{aud:b,at:b.type,q:'wait',tries:0,err:''});await put(i);redo=null;$('#rd').className='';flash(code)}
else{const img=await imgP,n=++N,c=pad(n),tiny=b.size<1500;W('n',N);
await put({code:c,n,ts:Date.now(),img,aud:b,at:b.type,text:'',fixed:'',sec:'',place:'',st:tiny?'unk':'',q:tiny?'done':'wait',tries:0,err:''});flash(c)}
stat();kick()}catch(e){toast('فشل الحفظ '+(code||''))}}
// ---------- التحويل إلى نص ----------
function parse(t){const x=nz(t),has=l=>l.split(/[,،\n]/).some(w=>(w=nz(w.trim()))&&x.includes(w));let sec='';
for(const ln of S('kw_sec',KW.sec).split('\n')){const[n,w]=ln.split(':');if(w&&has(w)){sec=n.trim();break}}
const m=t.match(/(رف|ممر|أرضية|ارضية|طابق|غرفة)\s*(?:رقم\s*)?(\S+)/);
let st=has(S('kw_bad',KW.bad))?'bad':has(S('kw_old',KW.old))?'old':has(S('kw_nw',KW.nw))?'new':'';
if(x.replace(/[^ء-ي0-9a-z]/g,'').length<2||has(S('kw_unk',KW.unk)))st=st||'unk';
return{sec,st,place:m?m[1]+' '+m[2].replace(/[.،,؟]+$/,''):''}}
async function stt(b){const el=S('prov','el')=='el',f=new FormData(),h={};let u;
if(el){u='https://api.elevenlabs.io/v1/speech-to-text';h['xi-api-key']=S('key').trim();f.append('model_id',S('model','scribe_v1'));f.append('language_code','ara');f.append('tag_audio_events','false')}
else{u=S('url');h.Authorization='Bearer '+S('key').trim();f.append('model',S('model','whisper-1'));f.append('language','ar')}
f.append('file',b,'a.'+ex(b.type));const r=await fetch(u,{method:'POST',headers:h,body:f}),j=await r.json().catch(()=>({}));
if(!r.ok)throw new Error(r.status+' '+JSON.stringify(j.detail||j.error||j).slice(0,160));return(j.text||'').trim()}
async function kick(){if(busy)return;busy=true;try{for(;;){
if(!navigator.onLine||!S('key').trim())break;
const it=(await all()).filter(i=>i.q=='wait'||i.q=='busy').sort((a,b)=>a.n-b.n)[0];if(!it)break;
it.q='busy';await put(it);stat();let t,er;try{t=await stt(it.aud)}catch(e){er=String(e.message||e).slice(0,200)}
const c=await get(it.code);if(!c)continue;
if(er===undefined){const p=parse(t);Object.assign(c,{text:t,q:'done',err:'',tries:0,sec:c.sec||p.sec,place:c.place||p.place,st:c.st||p.st})}
else{c.tries++;c.err=er;c.q=c.tries>=3?'fail':'wait';c.q=='fail'&&toast(c.code+': فشل التحويل')}
await put(c);stat();if(er!==undefined&&c.q=='wait')await sleep(4000*c.tries)}}finally{busy=false;stat()}}
addEventListener('online',kick);
// ---------- قائمة المواد ----------
async function list(more){if(!more)shown=50;urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
const a=(await all()).sort((x,y)=>y.n-x.n),q=nz($('#sq').value.trim()),cur=$('#fs').value,ft=$('#ft').value,fq=$('#fq').value;
$('#fs').innerHTML='<option value="">كل الأقسام</option><option value="-">بدون قسم</option>'+[...new Set(a.map(i=>i.sec).filter(Boolean))].map(s=>`<option>${esc(s)}</option>`).join('');$('#fs').value=cur;const fs=$('#fs').value;
const r=a.filter(i=>(!fs||(fs=='-'?!i.sec:i.sec==fs))&&(!ft||i.st==ft)&&(!fq||i.q==fq)&&(!q||nz([i.code,i.text,i.fixed,i.place,i.sec].join(' ')).includes(q)));
$('#lst').innerHTML=r.slice(0,shown).map(i=>{const u=i.img?URL.createObjectURL(i.img):'';urls.push(u);
return`<div class="it"><img src="${u}" data-v="${i.code}"><div><b>${i.code}</b> <span class="c ${i.st}">${SL[i.st]}</span> <span class="c q${i.q}">${QL[i.q]}</span><p>${esc(i.fixed||i.text)||'—'}</p><small>${esc([i.sec,i.place].filter(Boolean).join(' • '))}</small></div><button data-p="${i.code}">▶</button><button data-e="${i.code}">✏</button></div>`}).join('')||'<p>لا توجد مواد</p>';
vl=r.map(i=>i.code);$('#mr').style.display=r.length>shown?'':'none';$('#cnt').textContent=r.length+' مادة'}
['#sq','#fs','#ft','#fq'].forEach(s=>$(s).oninput=()=>list());$('#mr').onclick=()=>{shown+=50;list(1)};
$('#lst').onclick=e=>{const b=e.target.closest('[data-p],[data-e],[data-v]');if(!b)return;b.dataset.p?play(b.dataset.p):b.dataset.v?view(b.dataset.v):edit(b.dataset.e)};
async function play(c){const i=await get(c);aud?.pause();aud=new Audio(URL.createObjectURL(i.aud));aud.play().catch(()=>toast('تعذر تشغيل الصوت'))}
let vu;async function view(c){const i=await get(c);if(!i)return;vc=c;URL.revokeObjectURL(vu);vu=i.img?URL.createObjectURL(i.img):'';$('#vi').src=vu;
$('#vc').textContent=c+' • '+SL[i.st]+' • '+QL[i.q];$('#vt').textContent=i.fixed||i.text||'(لا يوجد نص بعد)';$('#vm').textContent=[i.sec,i.place,new Date(i.ts).toLocaleString('ar-IQ')].filter(Boolean).join(' • ');go('pv')}
const vstep=d=>{const k=vl.indexOf(vc)+d;vl[k]&&view(vl[k])};$('#vn').onclick=()=>vstep(1);$('#vp').onclick=()=>vstep(-1);$('#vl2').onclick=()=>play(vc);$('#ve').onclick=()=>edit(vc);
async function edit(c){const i=await get(c);ec=c;$('#ei').src=i.img?URL.createObjectURL(i.img):'';$('#ec').textContent=c+' • '+QL[i.q]+(i.err&&i.q!='done'?' • '+i.err:'');
$('#et').value=i.fixed||i.text;$('#es').value=i.sec;$('#ep').value=i.place;$('#est').value=i.st;go('pe')}

async function zip(files){const parts=[],cd=[],enc=new TextEncoder();let off=0,cs=0;

cd.push(e,nm);off+=30+nm.length+u.length;cs+=46+nm.length}
const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,1);z.setUint16(8,files.length,1);z.setUint16(10,files.length,1);z.setUint32(12,cs,1);z.setUint32(16,off,1);

async function unz(b){const dv=async(s,e)=>new DataView(await b.slice(s,e).arrayBuffer()),z=await dv(b.size-22,b.size),n=z.getUint16(10,1),cs=z.getUint32(12,1),co=z.getUint32(16,1),c=await dv(co,co+cs),m={};let p=0;
